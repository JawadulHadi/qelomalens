<svg width="1600" height="840" viewBox="0 0 1600 840" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="QelomaLens — The lens that sees beyond the page">
  <title>QelomaLens — The lens that sees beyond the page</title>

  <defs>
    <clipPath id="frame">
      <rect x="0" y="0" width="1600" height="840" rx="0" />
    </clipPath>
    <filter id="mark-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1A1A1A" flood-opacity="0.28" />
    </filter>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Background -->
    <rect x="0" y="0" width="1600" height="840" fill="#F8F7F4" />

    <!-- Editorial top accent bar -->
    <rect x="0" y="0" width="1600" height="10" fill="#C0532E" />

    <!-- Real Qeloma brand mark, large, right side -->
    <g transform="translate(1080,150)" filter="url(#mark-shadow)">
      <svg width="380" height="380" viewBox="0 0 100 100">
        <defs>
          <linearGradient id="g-tile" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3B5268"/>
            <stop offset="1" stop-color="#1B2733"/>
          </linearGradient>
          <linearGradient id="g-core" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#E0743F"/>
            <stop offset="1" stop-color="#8E3A1E"/>
          </linearGradient>
          <radialGradient id="g-sheen" cx="0.32" cy="0.28" r="0.75">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
            <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
            <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="g-ring" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
            <stop offset="1" stop-color="#ffffff" stop-opacity="0.45"/>
          </linearGradient>
          <filter id="f-soft" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="0.7"/>
          </filter>
          <filter id="f-glow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="2.2" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <clipPath id="clip-tile"><rect x="6" y="6" width="88" height="88" rx="20"/></clipPath>
        </defs>
        <rect x="6" y="9" width="88" height="88" rx="20" fill="#0C141C"/>
        <rect x="6" y="6" width="88" height="88" rx="20" fill="url(#g-tile)"/>
        <g clip-path="url(#clip-tile)">
          <rect x="6" y="6" width="88" height="88" fill="url(#g-sheen)"/>
          <rect x="6" y="70" width="88" height="28" fill="#000000" opacity="0.18"/>
        </g>
        <g transform="translate(50 50)">
          <circle r="26" fill="none" stroke="url(#g-ring)" stroke-width="2.4" stroke-opacity="0.30" stroke-dasharray="120 40"/>
          <circle cx="0" cy="-26" r="2.6" fill="#fff" opacity="0.9"/>
          <circle r="20" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-opacity="0.92" filter="url(#f-soft)"/>
          <circle r="20" fill="#16222E" fill-opacity="0.35"/>
          <g filter="url(#f-glow)">
            <circle r="8.5" fill="url(#g-core)"/>
            <circle cx="-2.2" cy="-2.2" r="3" fill="#fff" opacity="0.55"/>
          </g>
          <path d="M14.5 14.5 L30 30" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-opacity="0.92"/>
          <path d="M14.5 14.5 L30 30" stroke="#C0532E" stroke-width="2" stroke-linecap="round" stroke-opacity="0.85"/>
        </g>
        <rect x="14" y="14" width="7" height="7" rx="1.5" fill="#C0532E"/>
      </svg>
    </g>

    <!-- Eyebrow pill badge -->
    <rect x="120" y="238" width="322" height="34" rx="17" fill="#C0532E" />
    <text x="281" y="260" text-anchor="middle" font-family="'Geist Mono','Courier New',monospace" font-size="13" font-weight="700" letter-spacing="2.4" fill="#FFFFFF">AI DOCUMENT UNDERSTANDING</text>

    <!-- Wordmark -->
    <text x="118" y="410" font-family="Georgia,'Cormorant Garamond','Times New Roman',serif" font-style="italic" font-weight="600" font-size="128" fill="#1A1A1A">QelomaLens</text>

    <!-- Tagline -->
    <text x="122" y="466" font-family="Georgia,'Cormorant Garamond','Times New Roman',serif" font-style="italic" font-weight="500" font-size="34" fill="#4A4A46">The lens that sees beyond the page.</text>

    <!-- Divider -->
    <rect x="122" y="512" width="72" height="3" fill="#C0532E" />

    <!-- Caption row -->
    <text x="122" y="556" font-family="'Geist Mono','Courier New',monospace" font-size="15" letter-spacing="1.6" fill="#737373">PDF &#183; DOCX &#183; IMAGES &#183; TEXT &#8212; POWERED BY GOOGLE GEMINI</text>

    <!-- Bottom meta strip -->
    <line x1="120" y1="742" x2="1480" y2="742" stroke="#1A1A1A" stroke-opacity="0.12" stroke-width="1.5" />
    <text x="120" y="778" font-family="'Geist Mono','Courier New',monospace" font-size="13" letter-spacing="2" fill="#737373">GATEWAY ACTIVE / SESSION STABLE</text>
    <text x="1480" y="778" text-anchor="end" font-family="'Geist Mono','Courier New',monospace" font-size="13" letter-spacing="2" fill="#737373">OPEN-SOURCE &#183; MIT LICENSED</text>
  </g>
</svg>
