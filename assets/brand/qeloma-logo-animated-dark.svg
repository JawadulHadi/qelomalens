<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 100 100" role="img" aria-label="Qeloma logo">
  <defs>
    <linearGradient id="g-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22303F"/>
      <stop offset="1" stop-color="#0B1118"/>
    </linearGradient>
    <linearGradient id="g-core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E0743F"/>
      <stop offset="1" stop-color="#8E3A1E"/>
    </linearGradient>
    <radialGradient id="g-sheen" cx="0.32" cy="0.28" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.45"/>
    </linearGradient>
    <filter id="f-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
    <filter id="f-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip-tile"><rect x="6" y="6" width="88" height="88" rx="20"/></clipPath>
  </defs>
  <rect x="6" y="9" width="88" height="88" rx="20" fill="#05080C"/>
  <rect x="6" y="6" width="88" height="88" rx="20" fill="url(#g-tile)"/>
  <g clip-path="url(#clip-tile)">
    <rect x="6" y="6" width="88" height="88" fill="url(#g-sheen)"/>
    <rect x="6" y="70" width="88" height="28" fill="#000000" opacity="0.18"/>
    <rect x="-30" y="6" width="26" height="88" fill="#E0743F" opacity="0">
      <animate attributeName="x" values="-30;100" dur="3.6s" begin="0.4s" repeatCount="indefinite" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.2 1"/>
      <animate attributeName="opacity" values="0;0.18;0" dur="3.6s" begin="0.4s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g transform="translate(50 50)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
      <circle r="26" fill="none" stroke="url(#g-ring)" stroke-width="2.4" stroke-opacity="0.30" stroke-dasharray="120 40"/>
      <circle cx="0" cy="-26" r="2.6" fill="#fff" opacity="0.9"/>
    </g>
    <circle r="20" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-opacity="0.92" filter="url(#f-soft)"/>
    <circle r="20" fill="#0B1620" fill-opacity="0.35"/>
    <g filter="url(#f-glow)">
      <circle r="8.5" fill="url(#g-core)">
        <animate attributeName="r" values="7.6;9.4;7.6" dur="2.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
      </circle>
      <circle r="8.5" fill="none" stroke="#E0743F" stroke-width="1.4" opacity="0">
        <animate attributeName="r" values="8.5;15" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-2.2" cy="-2.2" r="3" fill="#fff" opacity="0.55"/>
    </g>
    <path d="M14.5 14.5 L30 30" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-opacity="0.92"/>
    <path d="M14.5 14.5 L30 30" stroke="#C0532E" stroke-width="2" stroke-linecap="round" stroke-opacity="0.85"/>
  </g>
  <rect x="14" y="14" width="7" height="7" rx="1.5" fill="#C0532E">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
  </rect>
</svg>